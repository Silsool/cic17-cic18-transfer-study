[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cic17-cic18-transfer-study"
version = "0.1.0"
description = "CIC2017/CIC2018 dataset comparison, binary transfer, and source-training coverage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "pyarrow>=14.0", "duckdb>=1.0",
  "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3", "ipykernel>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nids_transfer*"]
